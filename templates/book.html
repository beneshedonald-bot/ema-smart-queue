{% extends "base_user.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h3 class="fw-bold" style="color:#002a8a">Book Appointment</h3>
    <div class="card card-ema p-4 mt-3">
      <form method="post">
        
        <div class="mb-3">
          <label class="small fw-bold">Full Name</label>
          <input name="full_name" class="form-control rounded-3 py-2" required>
        </div>

        <div class="mb-3">
          <label class="small fw-bold">Phone</label>
          <input name="phone" class="form-control rounded-3 py-2" required>
        </div>

        <!-- NEW EMAIL FIELD -->
        <div class="mb-3">
          <label class="small fw-bold">Email (for approval notice)</label>
          <input type="email" name="email" class="form-control rounded-3 py-2" required placeholder="yourname@gmail.com">
        </div>

        <div class="mb-3">
          <label class="small fw-bold">Facility</label>
          <select name="facility_id" class="form-select rounded-3 py-2" required>
            {% for f in facilities %}
              <option value="{{ f.id }}">{{ f.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="small fw-bold">Service</label>
          <select name="service_id" class="form-select rounded-3 py-2" required>
            {% for s in services %}
              <option value="{{ s.id }}">{{ s.name }} </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="small fw-bold">Preferred Date</label>
          <input type="date" name="preferred_date" class="form-control rounded-3 py-2" required>
        </div>

        <button class="btn btn-ema w-100 py-3">Submit Booking</button>

      </form>
    </div>
  </div>
</div>
{% endblock %}
