{% extends "base_staff.html" %}{% block content %}<h3 class="fw-bold">Walk-In</h3><div class="card card-ema p-4 mt-3" style="max-width:520px"><form method="post"><input name="full_name" placeholder="Full Name" class="form-control mb-2 rounded-3" required><input name="phone" placeholder="Phone" class="form-control mb-2 rounded-3" required><select name="facility_id" class="form-select mb-2 rounded-3">{% for f in facilities %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}</select><select name="service_id" class="form-select mb-2 rounded-3">{% for s in services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><button class="btn btn-dark w-100 rounded-3">Add Walk-In</button></form></div>{% endblock %}
