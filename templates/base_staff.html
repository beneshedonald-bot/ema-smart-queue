<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ema! - Staff</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body{background:#f1f3f6;min-height:100vh;font-family:Inter,system-ui}
.bg-staff{background:#0f121a}
.card-ema{background:#fff;border:0;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.facility-pill{background:#ffffff2b;border:1px solid #ffffff30;color:#fff;border-radius:20px;padding:4px 12px;font-size:13px}
.logo-img-staff{height:34px}
.nav-link-staff{color:#a0a3ad;text-decoration:none;font-weight:600;margin-right:20px}
.nav-link-staff.active{color:#fff}
</style>
</head><body>
<!-- STAFF NAVBAR ONLY -->
<nav class="navbar navbar-dark bg-staff py-3 sticky-top"><div class="container-fluid px-4 d-flex align-items-center">
<a class="navbar-brand d-flex align-items-center gap-2" href="/staff/dashboard"><img src="/static/ema_logo.png" class="logo-img-staff" alt="Ema!"><span class="ms-1 fw-bold">Staff</span></a>
<div class="ms-4 d-flex align-items-center">
<a href="/staff/dashboard" class="nav-link-staff active">Dashboard</a>
<a href="/staff/walkin" class="nav-link-staff">Walk-in</a>
<a href="/staff/reports" class="nav-link-staff">Reports</a>
</div>
<div class="ms-3"><span class="facility-pill"><i class="fa-solid fa-location-dot me-1"></i> Botho University Clinic</span></div>
<div class="ms-auto d-flex align-items-center gap-3">
<span class="text-white small"><i class="fa-solid fa-user me-1"></i> {{ session.get('role','staff')|capitalize }}: {{ session.get('username','') }}</span>
<a href="/staff/logout" class="text-white-50 small text-decoration-none">Logout</a>
</div>
</div></nav>
<div class="container-fluid px-4 mt-4">{% block content %}{% endblock %}</div>
<footer class="text-center mt-5 mb-3 small text-muted">Ema! – Staff Interface</footer>
</body></html>
