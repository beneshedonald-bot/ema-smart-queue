<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ema! Staff Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0f121a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui}.card-ema{background:#fff;border:0;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);}.logo-img{height:52px}</style>
</head><body>
<div class="card card-ema p-4" style="width:380px">
<div class="text-center mb-3"><img src="/static/ema_logo.png" class="logo-img" alt="Ema!"><h5 class="fw-bold mt-2">Staff Login</h5><p class="text-muted small">Botho University Clinic</p></div>
{% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="alert alert-danger py-2 small">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
<form method="post"><input name="username" placeholder="Username (reception)" class="form-control mb-2 rounded-3" required><input name="password" type="password" placeholder="Password (rec123)" class="form-control mb-3 rounded-3" required><button class="btn btn-dark w-100 rounded-3 fw-bold">Sign In</button></form>
<div class="text-center mt-3"><a href="/" class="small text-muted text-decoration-none">← Back to Patient site</a></div>
</div>
</body></html>
